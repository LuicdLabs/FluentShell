              - row "DWMWA_BORDER_MARGINS Use with DwmSetWindowAttribute . Specifies the override location of the window border, as a distance from each edge. The pvAttribute parameter points to a value of type FRAME_MARGIN. A value of all zeros disables the override set by this attribute, resulting in default window borders. Otherwise, all values must be greater than or equal to 1. Each value in the FRAME_MARGIN (left, right, top, bottom) indicates a distance inwards from each edge of the window. Non-zero border margins forces the window to have a border and sets the location of the border. Window contents covered by or outside the border are clipped. This value will be supported in an upcoming update to Windows 11 build 26100." [ref=e286]:
