              - row "DWMWA_REDIRECTIONBITMAP_ALPHA Use with DwmSetWindowAttribute . Enables or disables the use of the alpha channel in the window's redirection bitmap. If this attribute is set to true, the window must contain premultiplied alpha values in each pixel. If it is false, the alpha is ignored and the redirection bitmap is treated as fully opaque. This attribute defaults to false. This value is supported starting with Windows 11 Build 26100." [ref=e282]:
